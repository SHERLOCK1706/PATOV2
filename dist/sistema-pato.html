<title>Sistema PATO SR/MT</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: aplicativo de trabalho com barra lateral de etapas (placa verde federal) e área principal de tabelas; amarelo de sinalização só para alertas */
:root{
  --bg:#f3f6f4; --surface:#ffffff; --surface2:#f8faf9; --fg:#16201b; --muted:#56635c; --line:#d6ded9; --line2:#e7ece9;
  --sign:#1f6b46; --sign-fg:#ffffff; --sign-soft:#e2efe7; --sign-ink:#185638;
  --warn:#8f5c0f; --warn-soft:#fbf0d9; --bad:#b0352d; --bad-soft:#f8e3e1; --ok:#2a7a4b; --ok-soft:#e1f2e7; --info:#2d5d86; --info-soft:#e3edf6;
  --f-display:"Barlow Condensed","Arial Narrow",Arial,sans-serif; --f-body:"Barlow","Segoe UI",Roboto,Arial,sans-serif; --f-mono:"JetBrains Mono",ui-monospace,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0e1411; --surface:#151d19; --surface2:#19221e; --fg:#e3eae5; --muted:#9aa8a0; --line:#2a3530; --line2:#212b26;
  --sign:#2e8a5c; --sign-fg:#f2fbf6; --sign-soft:#1a2c22; --sign-ink:#7fd1a5;
  --warn:#e3ad52; --warn-soft:#2c2414; --bad:#ea7a70; --bad-soft:#2f1917; --ok:#5cc489; --ok-soft:#16281d; --info:#86b7e3; --info-soft:#17232e; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e1411; --surface:#151d19; --surface2:#19221e; --fg:#e3eae5; --muted:#9aa8a0; --line:#2a3530; --line2:#212b26;
  --sign:#2e8a5c; --sign-fg:#f2fbf6; --sign-soft:#1a2c22; --sign-ink:#7fd1a5;
  --warn:#e3ad52; --warn-soft:#2c2414; --bad:#ea7a70; --bad-soft:#2f1917; --ok:#5cc489; --ok-soft:#16281d; --info:#86b7e3; --info-soft:#17232e; color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--sign)}
.app{display:grid;grid-template-columns:232px minmax(0,1fr);min-height:100%}
aside{background:var(--sign);color:var(--sign-fg);padding:18px 12px 24px max(12px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:14px;position:sticky;top:env(safe-area-inset-top,0px);height:100vh;overflow:auto}
.brand{font-family:var(--f-display);font-weight:700;font-size:1.45rem;line-height:1;letter-spacing:.02em;padding:6px 8px 10px;border-bottom:1px solid rgba(255,255,255,.25)}
.brand small{display:block;font-family:var(--f-body);font-weight:500;font-size:.75rem;opacity:.8;letter-spacing:0;margin-top:4px}
nav{display:grid;gap:2px}
nav a{display:flex;gap:10px;align-items:center;color:var(--sign-fg);text-decoration:none;padding:7px 10px;border-radius:6px;font-weight:500;font-size:.93rem}
nav a .n{font-family:var(--f-mono);font-size:.7rem;opacity:.7;width:18px}
nav a:hover{background:rgba(255,255,255,.12)}
nav a[aria-current="page"]{background:var(--sign-fg);color:var(--sign-ink)}
nav a .dot{margin-left:auto;min-width:18px;height:18px;border-radius:9px;font-size:.7rem;display:grid;place-items:center;padding:0 5px;font-weight:600}
nav a .dot.bad{background:var(--bad);color:#fff}
nav a .dot.warn{background:#e3ad52;color:#2a1d05}
nav .sep{font-family:var(--f-display);font-size:.72rem;text-transform:uppercase;letter-spacing:.12em;opacity:.65;padding:10px 10px 2px}
.save{margin-top:auto;font-size:.8rem;opacity:.9;padding:8px 10px;border-top:1px solid rgba(255,255,255,.25)}
main{min-width:0;padding-block:20px 60px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:1240px;margin:0 auto;display:grid;gap:20px}
.top{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;justify-content:space-between}
.top h1{font-family:var(--f-display);font-size:1.9rem;margin:0;line-height:1.1;text-wrap:balance}
.top .meta{color:var(--muted);font-size:.88rem}
h2{font-family:var(--f-display);font-size:1.35rem;margin:0;font-weight:600}
h3{font-family:var(--f-display);font-size:1.1rem;margin:0;font-weight:600}
p{margin:0;max-width:75ch}
.muted{color:var(--muted)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:16px;display:grid;gap:12px;min-width:0;align-content:start}
.card.flat{padding:0;overflow:hidden}
.card-h{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;justify-content:space-between}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:16px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:8px;overflow:hidden}
.kpi{background:var(--surface);padding:12px 14px;display:grid;gap:2px;align-content:start;min-width:0}
.kpi b{overflow-wrap:anywhere;font-family:var(--f-display);font-size:clamp(1.15rem,2.2vw,1.5rem);font-weight:600;line-height:1.1;font-variant-numeric:tabular-nums}
.kpi span{color:var(--muted);font-size:.82rem}
.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums;font-size:.84rem}
.mono{font-family:var(--f-mono);font-size:.82rem}
.tbl{overflow:auto;max-height:70vh}
.tbl.short{max-height:none}
table{border-collapse:collapse;width:100%;font-size:.86rem}
th,td{padding:6px 9px;text-align:left;vertical-align:top;border-bottom:1px solid var(--line2)}
thead th{position:sticky;top:0;background:var(--surface2);font-family:var(--f-display);font-weight:600;font-size:.88rem;color:var(--muted);z-index:1;white-space:nowrap}
td.r,th.r{text-align:right;white-space:nowrap}
tr.g td{background:var(--sign-soft);font-weight:600}
tr.g1 td{background:var(--sign);color:var(--sign-fg);font-weight:600}
tr.sub td.desc{padding-left:22px;color:var(--muted)}
tr.sub2 td.desc{padding-left:36px;color:var(--muted)}
tr.clk{cursor:pointer}
tr.clk:hover td{background:var(--surface2)}
tr.hl td{box-shadow:inset 3px 0 0 var(--warn)}
.chip{display:inline-block;font-family:var(--f-mono);font-size:.68rem;padding:1px 6px;border-radius:4px;background:var(--sign-soft);color:var(--sign-ink);white-space:nowrap}
.pill{display:inline-flex;align-items:center;gap:4px;font-family:var(--f-display);font-weight:600;font-size:.78rem;letter-spacing:.05em;text-transform:uppercase;padding:2px 9px;border-radius:999px;white-space:nowrap}
.pill.ok{background:var(--ok-soft);color:var(--ok)}.pill.alerta{background:var(--warn-soft);color:var(--warn)}.pill.erro{background:var(--bad-soft);color:var(--bad)}.pill.info{background:var(--info-soft);color:var(--info)}
.btn{font:inherit;font-weight:600;font-size:.88rem;padding:7px 12px;border-radius:6px;border:1px solid var(--line);background:var(--surface);color:var(--fg);cursor:pointer;display:inline-flex;gap:6px;align-items:center;text-decoration:none}
.btn:hover{border-color:var(--sign)}
.btn.pri{background:var(--sign);border-color:var(--sign);color:var(--sign-fg)}
.btn.sm{padding:3px 8px;font-size:.8rem}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,a:focus-visible{outline:2px solid var(--sign);outline-offset:2px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
input,select,textarea{font:inherit;font-size:.88rem;color:var(--fg);background:var(--surface);border:1px solid var(--line);border-radius:5px;padding:5px 8px;min-width:0}
input.n{font-family:var(--f-mono);text-align:right;width:110px}
input.cell{width:100%;border-color:transparent;background:transparent}
input.cell:hover{border-color:var(--line)}
textarea{width:100%;font-family:var(--f-mono);font-size:.82rem}
label.f{display:grid;gap:3px;font-size:.8rem;color:var(--muted)}
label.f input,label.f select{font-size:.92rem;color:var(--fg)}
.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px 14px}
.flow{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px}
.flow .st{border:1px solid var(--line);border-radius:8px;padding:10px;display:grid;gap:4px;background:var(--surface2)}
.flow .st b{font-family:var(--f-display);font-size:1rem}
.flow .st span{font-size:.8rem;color:var(--muted)}
.rule{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 12px;padding:12px 14px;border-bottom:1px solid var(--line2)}
.rule:last-child{border-bottom:0}
.rule .pill{grid-row:span 3;align-self:start}
.rule h3{font-size:1.02rem}
.rule .art{font-family:var(--f-mono);font-size:.72rem;color:var(--muted)}
.rule p{font-size:.88rem;color:var(--muted)}
.empty{border:1px dashed var(--line);border-radius:8px;padding:28px;text-align:center;display:grid;gap:10px;justify-items:center;background:var(--surface)}
.note{font-size:.84rem;color:var(--muted);border-left:3px solid var(--sign);padding:6px 10px;background:var(--surface2);border-radius:0 6px 6px 0}
.note.w{border-color:var(--warn)}
.overlay{position:fixed;inset:0;background:rgba(10,20,15,.45);z-index:40;display:flex;justify-content:flex-end}
.drawer{background:var(--surface);width:min(620px,100%);height:100%;overflow:auto;padding:20px max(20px,env(safe-area-inset-right,0px)) 40px 20px;display:grid;gap:14px;align-content:start;box-shadow:-8px 0 30px rgba(0,0,0,.2)}
.toast{position:fixed;bottom:calc(16px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:8px;z-index:50;font-size:.9rem;max-width:90vw}
.bar{height:8px;border-radius:4px;background:var(--line2);overflow:hidden}
.bar i{display:block;height:100%;background:var(--sign)}
.kv{display:grid;grid-template-columns:max-content minmax(0,1fr);gap:4px 14px;font-size:.88rem}
.kv dt{color:var(--muted)}.kv dd{margin:0;min-width:0;overflow-wrap:anywhere}
h1,h2,h3,.desc,td{overflow-wrap:anywhere}
.tabs{display:flex;gap:4px;flex-wrap:wrap}
.tabs button{font:inherit;font-size:.85rem;padding:5px 10px;border:1px solid var(--line);background:var(--surface);border-radius:999px;cursor:pointer;color:var(--fg)}
.tabs button[aria-pressed="true"]{background:var(--sign);color:var(--sign-fg);border-color:var(--sign)}
details>summary{cursor:pointer;font-weight:600}
.doc h2{margin-top:6px}
.doc ul{margin:0;padding-left:20px;display:grid;gap:3px}
.mobnav{display:none}
@media (max-width:900px){
  .app{grid-template-columns:1fr}
  aside{position:static;height:auto;padding:10px max(16px,env(safe-area-inset-left,0px)) 10px max(16px,env(safe-area-inset-left,0px))}
  nav,.save{display:none}
  .mobnav{display:block}
  .mobnav select{width:100%;font-size:1rem;background:var(--sign-fg);color:var(--sign-ink)}
  .flow{grid-template-columns:1fr 1fr}
  .kpis{grid-template-columns:1fr 1fr}
  .grid2{grid-template-columns:minmax(0,1fr)}
  .top h1{font-size:1.5rem}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<div class="app">
  <aside>
    <div class="brand">Sistema PATO<small>SR/DNIT/MT · Res. nº 8/2023</small></div>
    <div class="mobnav"><label class="f" style="color:var(--sign-fg)">Etapa<select id="mobnav"></select></label></div>
    <nav id="nav"></nav>
    <div class="save" id="savestate">Carregando…</div>
  </aside>
  <main><div class="wrap" id="view"><div class="empty"><h2>Carregando o sistema</h2><p class="muted">Abrindo a base de projetos.</p></div></div></main>
</div>
<input type="file" id="filepick" hidden>
<div id="drawer"></div>
<div id="toast" hidden class="toast"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script>
/* Motor de cálculo do PATO — Res. DNIT nº 8/2023
   Funciona no navegador (window.PatoEngine) e no Node (module.exports). */
(function (root) {
  'use strict';

  // ---------- aritmética compatível com o Excel ----------
  function fix15(x) { return Number(Number(x).toPrecision(15)); }
  function trunc(x, d) { const f = Math.pow(10, d); return Math.trunc(fix15(x * f)) / f; }
  function round(x, d) { const f = Math.pow(10, d); const v = fix15(x * f); return (v < 0 ? -Math.round(-v) : Math.round(v)) / f; }
  function roundup(x) { const v = fix15(x); return v < 0 ? -Math.ceil(-v) : Math.ceil(v); }
  const norm = s => String(s == null ? '' : s).trim().toUpperCase();

  // ---------- avaliador de expressões (sem eval) ----------
  function tokenize(src) {
    const t = []; let i = 0; const s = String(src);
    while (i < s.length) {
      const c = s[i];
      if (/\s/.test(c)) { i++; continue; }
      if (/[0-9.]/.test(c)) { let j = i; while (j < s.length && /[0-9.eE]/.test(s[j]) && !(/[eE]/.test(s[j]) && !/[0-9+-]/.test(s[j + 1] || ''))) j++; t.push({ k: 'n', v: parseFloat(s.slice(i, j)) }); i = j; continue; }
      if (/[A-Za-z_]/.test(c)) { let j = i; while (j < s.length && /[A-Za-z0-9_]/.test(s[j])) j++; t.push({ k: 'id', v: s.slice(i, j) }); i = j; continue; }
      if (c === '"' || c === "'") { let j = i + 1; while (j < s.length && s[j] !== c) j++; t.push({ k: 's', v: s.slice(i + 1, j) }); i = j + 1; continue; }
      if ('+-*/^(),'.includes(c)) { t.push({ k: c }); i++; continue; }
      throw new Error('Caractere inválido na expressão: ' + c);
    }
    return t;
  }
  function parse(src) {
    const t = tokenize(src); let p = 0;
    const peek = () => t[p], eat = k => { if (!t[p] || t[p].k !== k) throw new Error('Esperado ' + k + ' em: ' + src); return t[p++]; };
    function prim() {
      const x = peek(); if (!x) throw new Error('Expressão incompleta: ' + src);
      if (x.k === 'n') { p++; return { n: x.v }; }
      if (x.k === 's') { p++; return { s: x.v }; }
      if (x.k === '-') { p++; return { neg: pow() }; }
      if (x.k === '+') { p++; return pow(); }
      if (x.k === '(') { p++; const e = add(); eat(')'); return e; }
      if (x.k === 'id') {
        p++;
        if (peek() && peek().k === '(') { p++; const args = []; if (peek().k !== ')') { args.push(add()); while (peek().k === ',') { p++; args.push(add()); } } eat(')'); return { f: x.v, args }; }
        return { v: x.v };
      }
      throw new Error('Token inesperado em: ' + src);
    }
    function pow() { let l = prim(); while (peek() && peek().k === '^') { p++; l = { op: '^', l, r: prim() }; } return l; }
    function mul() { let l = pow(); while (peek() && (peek().k === '*' || peek().k === '/')) { const o = t[p++].k; l = { op: o, l, r: pow() }; } return l; }
    function add() { let l = mul(); while (peek() && (peek().k === '+' || peek().k === '-')) { const o = t[p++].k; l = { op: o, l, r: mul() }; } return l; }
    const e = add(); if (p < t.length) throw new Error('Sobrou texto na expressão: ' + src); return e;
  }
  const cache = new Map();
  function compile(src) { const k = String(src); if (!cache.has(k)) cache.set(k, parse(k === '' ? '0' : k)); return cache.get(k); }
  function evalNode(n, ctx) {
    if ('n' in n) return n.n;
    if ('s' in n) return n.s;
    if ('neg' in n) return -evalNode(n.neg, ctx);
    if ('op' in n) {
      const a = evalNode(n.l, ctx), b = evalNode(n.r, ctx);
      switch (n.op) { case '+': return a + b; case '-': return a - b; case '*': return a * b; case '/': return b === 0 ? 0 : a / b; case '^': return Math.pow(a, b); }
    }
    if ('v' in n) { if (!(n.v in ctx.vars)) throw new Error('Variável desconhecida: ' + n.v); return ctx.vars[n.v]; }
    if ('f' in n) {
      const fn = ctx.fns[n.f]; if (!fn) throw new Error('Função desconhecida: ' + n.f);
      return fn.apply(null, n.args.map(a => evalNode(a, ctx)));
    }
    throw new Error('Nó inválido');
  }
  function evaluate(src, ctx) { return evalNode(compile(src), ctx); }

  // ---------- módulos ----------
  function calcICP(st) {
    const P = st.icp.parametros || {}; const metodo = P.metodo || 'planilha';
    const mult = metodo === 'planilha' ? (Number(P.fatorFaixas) || 2) : 1;
    const rows = (st.icp.levantamento || []).filter(r => metodo === 'planilha' ? r.sentido !== 'D' : true);
    const pts = { Alta: 1, 'Média': 0.5, Baixa: 0.25, SR: 0 };
    const lev = (st.icp.levantamento || []).map(r => {
      const icp = 50 * (pts[r.panela] || 0) + 30 * (pts[r.remendo] || 0) + 20 * (pts[r.trinca] || 0);
      return Object.assign({}, r, { ext: Math.abs(r.kmFim - r.kmIni), icp, condicao: icp < 30 ? 'BOM' : icp < 50 ? 'REGULAR' : icp < 70 ? 'RUIM' : 'PÉSSIMO' });
    });
    const sumCls = cls => {
      let s = 0;
      rows.forEach(r => { const ext = Math.abs(r.kmFim - r.kmIni); if (cls.some(([col, val]) => norm(col === 'W' ? r.intervPrim : r.intervSec) === norm(val))) s += ext; });
      return s;
    };
    const vars = { largura: Number(P.larguraFaixa) || 3.6 };
    const res = {};
    (st.icp.regras || []).forEach(rg => { if (!rg.somaRegras) res[rg.id] = { km: roundup(sumCls(rg.classes || [])) }; });
    (st.icp.regras || []).forEach(rg => { if (rg.somaRegras) res[rg.id] = { km: rg.somaRegras.reduce((a, id) => a + (res[id] ? res[id].km : 0), 0) }; });
    (st.icp.regras || []).forEach(rg => {
      const ne = evaluate(rg.neExpr, { vars, fns: {} });
      const r = res[rg.id]; r.ne = ne; r.mult = mult; r.calc = ne * r.km * mult;
      const h = (st.icp.historico || {})[rg.id] || {}; r.historico = Number(h.valor) || 0;
      r.adotado = Math.max(r.calc, r.historico); r.criterio = r.adotado === r.calc ? 'ICP' : 'Histórico';
      r.servico = rg.servico; r.unidade = rg.unidade; r.neFonte = rg.neFonte;
    });
    return { metodo, mult, regras: res, levantamento: lev };
  }

  function calcRocada(st) {
    const es = (st.rocada && st.rocada.estacoes) || [];
    let a = 0, b = 0; es.forEach(e => { if (e.distancia > 0) { a += e.nere / e.distancia; b += 1 / e.distancia; } });
    const nerp = b ? a / b : 0;
    const sugerido = Math.round(nerp) + 1;
    const adotado = st.rocada && st.rocada.neAdotado != null && st.rocada.neAdotado !== '' ? Number(st.rocada.neAdotado) : (st.rocada && st.rocada.nePlanilha) || sugerido;
    return { nerp, sugerido, adotado };
  }

  function lookupCroqui(st, chave) {
    const k = norm(chave); const c = st.croqui || {};
    for (const key in c) if (norm(key) === k) return c[key];
    return null;
  }
  function calcFIT(st) {
    const out = {};
    (st.fit || []).forEach(f => {
      const c = lookupCroqui(st, f.chave);
      const dmtp = c ? Number(c.P) || 0 : 0, dmtu = c ? Number(c.Pu) || 0 : 0;
      const a1 = 70 + 0.0035 * (Number(f.vmdf) || 0), a2 = 60 * dmtu;
      const fit = dmtp > 0 ? 1 + (a1 + a2) / (dmtp * 60) : 1;
      out[f.frente + '|' + norm(f.chave)] = { fit, dmtp, dmtu, a1, a2, vmdf: f.vmdf, codigo: f.codigo, chave: f.chave, frente: f.frente };
    });
    return out;
  }

  function compute(st, opts) {
    opts = opts || {};
    const proj = st.projeto || {};
    const ext = Number(proj.extensao) || 0;
    const prazo = Number(proj.prazoAnos) || 1;
    const icp = calcICP(st);
    const rocada = calcRocada(st);
    const fitTab = calcFIT(st);
    const linhas = st.linhas || [];
    const byId = {}; linhas.forEach(L => byId[L.id] = L);
    const memo = {}; const busy = {};
    const erros = [];
    const precos = st.precos || {};

    const transpMemo = {};
    function transp(id) {
      if (id in transpMemo) return transpMemo[id].total;
      const blk = (st.transportes || []).find(b => b.id === id);
      if (!blk) { erros.push('Bloco de transporte não encontrado: ' + id); return 0; }
      let total = 0; const det = [];
      blk.linhas.forEach(l => {
        let q = 0;
        if (l.faixaPATO) linhas.forEach(L => { if (L.linha >= l.faixaPATO[0] && L.linha <= l.faixaPATO[1] && String(L.codigo) === String(l.servico)) q += line(L.id).qtd; });
        const consumo = evaluate(l.consumoExpr || '0', ctxBase());
        const c = lookupCroqui(st, l.chave);
        const dmt = c && l.colunaDMT ? (Number(c[l.colunaDMT]) || 0) : 0;
        let fit = 1;
        if (l.usaFIT) { const f = fitTab[l.fitFrente + '|' + norm(l.chave)]; fit = f ? f.fit : 1; }
        else if (l.fitFixo != null) fit = l.fitFixo;
        const momento = trunc(q * consumo * dmt * fit, 3);
        total += momento;
        det.push({ servico: l.servico, material: l.material, origem: l.origem, destino: l.destino, qtd: q, consumo, dmt, fit, momento, semCroqui: !c });
      });
      transpMemo[id] = { id, codigo: blk.codigo, frente: blk.frente, descricao: blk.descricao, total, linhas: det };
      return total;
    }

    function desempenho() {
      const D = st.desempenho; if (!D) return null;
      const ctx = ctxBase();
      let sd = 0, cd = 0; const det = [];
      D.linhas.forEach(l => {
        let qkm;
        if (l.auxiliar) qkm = evaluate(l.qtdPorKmExpr, ctx);
        else {
          const tot = evaluate(l.qtdTotalExpr, ctx);
          const freq = evaluate(l.freqExpr, ctx);
          qkm = ext ? trunc(tot * l.ne * freq / ext, 3) : 0;
          l._tot = tot; l._freq = freq;
        }
        const p = precos[l.codigo] || {};
        const psd = Number(p.sd) || 0, pcd = Number(p.cd) || 0;
        sd += qkm * psd; cd += qkm * pcd;
        det.push({ codigo: l.codigo, descricao: p.descricao || '', grupo: l.grupo, memoria: l.memoria, unidade: l.unidade, qtdTotal: l._tot, ne: l.ne, freq: l._freq, qtdPorKm: qkm, puSD: psd, puCD: pcd, kmAnoSD: qkm * psd, kmAnoCD: qkm * pcd, auxiliar: !!l.auxiliar });
      });
      const kmMesSD = trunc(sd / 12, 2), kmMesCD = trunc(cd / 12, 2);
      return { linhas: det, kmAnoSD: sd, kmAnoCD: cd, kmMesSD, kmMesCD, mesSD: trunc(kmMesSD * ext, 2), mesCD: trunc(kmMesCD * ext, 2) };
    }
    const gd = desempenho();
    const precoDe = (codigo, col) => {
      if (codigo === (st.desempenho && st.desempenho.codigo) && gd) return col === 'sd' ? gd.mesSD : gd.mesCD;
      const p = precos[codigo]; return p ? Number(p[col]) || 0 : null;
    };

    function ctxBase(L) {
      return {
        vars: { prazo, ext, PI: Math.PI, neRocada: rocada.adotado, largura: Number((st.icp.parametros || {}).larguraFaixa) || 0, codigo: L ? L.codigo : '' },
        fns: {
          inv: k => { const i = (st.inventario || {})[k]; if (!i) { erros.push('Inventário sem a chave ' + k); return 0; } return Number(i.valor) || 0; },
          icp: id => icp.regras[id] ? icp.regras[id].adotado : 0,
          icpKm: id => icp.regras[id] ? icp.regras[id].km : 0,
          transp: id => transp(id),
          undia: (fr, cod) => { const t = (st.undia || {})[fr] || {}; return Number(t[String(cod)]) || 0; },
          qtd: id => line(id).qtd, base: id => line(id).base, fator: id => line(id).fator,
        },
      };
    }
    function line(id) {
      if (memo[id]) return memo[id];
      const L = byId[id]; if (!L) { erros.push('Linha inexistente: ' + id); return { qtd: 0, base: 0, fator: 0 }; }
      if (busy[id]) { erros.push('Referência circular na linha ' + L.item); return { qtd: 0, base: 0, fator: 0 }; }
      busy[id] = true;
      const ctx = ctxBase(L);
      let base = 0, fator = 0, qtd = 0, err = null;
      try {
        base = evaluate(L.baseExpr, ctx);
        if (L.modo === 'icp') { qtd = icp.regras[L.icpRegra] ? icp.regras[L.icpRegra].adotado : 0; fator = base ? qtd / base : 0; }
        else {
          fator = evaluate(L.fatorExpr === '' || L.fatorExpr == null ? '1' : L.fatorExpr, ctx);
          qtd = L.modo === 'round' ? round(base * fator, L.casas == null ? 3 : L.casas) : trunc(base * fator, L.casas == null ? 3 : L.casas);
        }
      } catch (e) { err = e.message; erros.push('Linha ' + L.item + ': ' + e.message); }
      const puSD = precoDe(L.codigo, 'sd'), puCD = precoDe(L.codigo, 'cd');
      const r = { id, base, fator, qtd, puSD, puCD, sd: puSD == null ? 0 : trunc(qtd * puSD, 2), cd: puCD == null ? 0 : trunc(qtd * puCD, 2), semPreco: puSD == null || puCD == null, erro: err };
      memo[id] = r; busy[id] = false; return r;
    }
    linhas.forEach(L => line(L.id));
    (st.transportes || []).forEach(b => transp(b.id));

    // estrutura de grupos pela ordem das linhas
    const grupos = (st.grupos || []).slice().sort((a, b) => a.linha - b.linha);
    const all = grupos.map(g => ({ tipo: 'g', linha: g.linha, g })).concat(linhas.map(L => ({ tipo: 'l', linha: L.linha, L }))).sort((a, b) => a.linha - b.linha);
    const res = {}; let top = null, sub = null; const ordem = [];
    all.forEach(x => {
      if (x.tipo === 'g') {
        const nivel = x.g.item.split('.').length;
        if (nivel === 1) { top = x.g; sub = null; }
        else if (nivel === 2) { sub = x.g; }
        ordem.push({ tipo: 'g', id: x.g.id, item: x.g.item, titulo: x.g.titulo, nivel });
        return;
      }
      const L = x.L; const r = memo[L.id];
      r.familia = top ? top.item : L.item.slice(0, 2); r.grupo = sub ? sub.item : null; r.grupoTitulo = sub ? sub.titulo : '';
      res[L.id] = r; ordem.push({ tipo: 'l', id: L.id });
    });
    const resumo = []; const idx = {};
    grupos.forEach(g => { if (g.item.split('.').length === 2) { idx[g.item] = { item: g.item, titulo: g.titulo, sd: 0, cd: 0, familia: g.item.slice(0, 2) }; resumo.push(idx[g.item]); } });
    let conservaSD = 0, conservaCD = 0, dsmSD = 0, dsmCD = 0;
    linhas.forEach(L => {
      const r = res[L.id]; if (!r) return;
      if (r.grupo && idx[r.grupo]) { idx[r.grupo].sd += r.sd; idx[r.grupo].cd += r.cd; }
      if (r.familia === '02') { dsmSD += r.sd; dsmCD += r.cd; } else { conservaSD += r.sd; conservaCD += r.cd; }
    });
    const totSD = conservaSD + dsmSD, totCD = conservaCD + dsmCD;
    resumo.forEach(g => { g.pSD = totSD ? g.sd / totSD : 0; g.pCD = totCD ? g.cd / totCD : 0; });
    const condicao = totSD <= totCD ? 'sd' : 'cd';

    // planilha contratual e curva ABC (por código)
    const dsmNoPrazo = opts.dsmNoPrazo != null ? opts.dsmNoPrazo : !!(st.parametros && st.parametros.dsmMultiplicaPrazo);
    function contratual(col, dobra) {
      if (dobra == null) dobra = dsmNoPrazo;
      const agg = {};
      linhas.forEach(L => {
        const r = res[L.id]; const mult = r.familia === '02' && !dobra ? 1 : prazo;
        const a = agg[L.codigo] || (agg[L.codigo] = { codigo: L.codigo, descricao: L.descricao || (precos[L.codigo] || {}).descricao, unidade: L.unidade, qtd: 0, pu: col === 'sd' ? r.puSD : r.puCD });
        a.qtd += r.qtd * mult;
      });
      const itens = Object.values(agg).map(a => Object.assign(a, { qtd: fix15(a.qtd), total: trunc((a.pu || 0) * fix15(a.qtd), 2) }));
      const total = itens.reduce((s, a) => s + a.total, 0);
      itens.sort((a, b) => b.total - a.total);
      let acc = 0; itens.forEach(a => { a.p = total ? a.total / total : 0; acc += a.p; a.acum = acc; a.faixa = acc <= 0.8 + 1e-12 ? 'A' : acc <= 0.95 + 1e-12 ? 'B' : 'C'; });
      return { itens, total };
    }
    const contratoSD = contratual('sd'), contratoCD = contratual('cd');
    const difDSM = { sd: contratual('sd', true).total - contratual('sd', false).total, cd: contratual('cd', true).total - contratual('cd', false).total };

    return {
      icp, rocada, fit: fitTab, desempenho: gd, transportes: transpMemo, linhas: res, ordem,
      resumo, totais: { conservaSD, conservaCD, dsmSD, dsmCD, sd: totSD, cd: totCD, condicao, pDSM: (condicao === 'sd' ? dsmSD / totSD : dsmCD / totCD) || 0 },
      contrato: { sd: contratoSD, cd: contratoCD, dsmNoPrazo, prazo, difDSM }, erros,
    };
  }

  // ---------- regras de validação (Res. DNIT nº 8/2023) ----------
  const ASFALTO = /^AM/;
  function validar(st, R, hoje) {
    const out = []; const add = (id, art, titulo, status, detalhe, ref) => out.push({ id, art, titulo, status, detalhe, ref: ref || [] });
    const P = st.projeto || {}; const linhas = st.linhas || [];
    const brl = v => v.toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
    hoje = hoje || new Date();

    // R01 data-base x abertura
    if (P.dataBase) {
      const [y, m] = P.dataBase.split('-').map(Number); const lim = new Date(y + 1, m - 1, 1);
      const ref = P.aberturaLicitacao ? new Date(P.aberturaLicitacao + 'T00:00:00') : hoje;
      const dentro = ref <= lim; const limTxt = lim.toLocaleDateString('pt-BR');
      add('R01', 'Art. 22, parágrafo único', 'Data-base com no máximo 1 ano até o início da licitação', dentro ? (P.aberturaLicitacao ? 'ok' : 'alerta') : 'erro',
        'Data-base ' + String(m).padStart(2, '0') + '/' + y + '; o prazo de 1 ano vai até ' + limTxt + '. ' + (P.aberturaLicitacao ? 'Início da licitação informado: ' + P.aberturaLicitacao.split('-').reverse().join('/') + '.' : (dentro ? 'Informe a data de início da licitação para confirmar.' : 'Esse prazo já passou e o início da licitação não foi informado. Se o processo ainda não começou, o orçamento precisa ir para o SICRO mais recente.')));
    } else add('R01', 'Art. 22, parágrafo único', 'Data-base com no máximo 1 ano até o início da licitação', 'erro', 'Data-base não informada.');

    // R02 DSM
    const pd = R.totais.pDSM;
    add('R02', 'Art. 6º, III', 'DSM limitados a 25% do orçamento inicial', pd <= 0.25 ? 'ok' : 'erro', 'DSM somam ' + brl(R.totais.condicao === 'sd' ? R.totais.dsmSD : R.totais.dsmCD) + ', ou ' + (pd * 100).toFixed(2).replace('.', ',') + '% do orçamento.');

    // R03 prazo
    const pz = Number(P.prazoAnos);
    add('R03', 'Art. 9º', 'Prazo de execução múltiplo de 1 ano', pz >= 1 && Number.isInteger(pz) ? 'ok' : 'erro', 'Prazo informado: ' + (P.prazoAnos || '—') + ' ano(s).');

    // R04 contrato: DSM no prazo
    const dif = R.contrato.difDSM ? R.contrato.difDSM[R.totais.condicao] : 0;
    add('R04', 'Art. 9º, § 3º', 'DSM não são de natureza continuada', R.contrato.dsmNoPrazo && R.contrato.prazo > 1 ? 'erro' : 'ok',
      R.contrato.dsmNoPrazo && R.contrato.prazo > 1 ? 'A planilha contratual multiplica também os DSM pelo prazo de ' + R.contrato.prazo + ' anos, repetindo obras pontuais. Isso acrescenta ' + brl(dif) + ' ao valor do contrato.' : 'Os DSM entram uma única vez na planilha contratual' + (dif > 0.01 ? ' (multiplicá-los pelo prazo acrescentaria ' + brl(dif) + ').' : '.'));

    // R05 grupo de desempenho I
    const temGD = linhas.some(L => L.codigo === 'GD');
    add('R05', 'Art. 5º, § 1º', 'Grupo de desempenho I obrigatório em rodovia pavimentada', P.tipo !== 'pavimentada' || temGD ? 'ok' : 'erro', temGD ? 'Item GD presente na planilha.' : 'Item de conservação da faixa de domínio por desempenho não encontrado.');

    // R06 origem
    const semOrigem = linhas.filter(L => !L.origem);
    add('R06', 'Art. 24, § 1º', 'Toda quantidade com origem declarada', semOrigem.length ? 'alerta' : 'ok', semOrigem.length ? semOrigem.length + ' linha(s) sem origem: ' + semOrigem.slice(0, 8).map(L => L.item).join(', ') + (semOrigem.length > 8 ? '…' : '') : 'Todas as ' + linhas.length + ' linhas declaram a origem.', semOrigem.map(L => L.id));

    // R07 acostamento fora de tapa-buraco / remendo
    const pav = linhas.filter(L => /^(4915757|4915631|4915632)$/.test(L.codigo));
    const comAcost = pav.filter(L => /acost_/.test(L.baseExpr || ''));
    add('R07', 'Art. 17, § 2º', 'Tapa-buraco e remendo calculados só sobre a pista', comAcost.length ? 'erro' : 'ok', comAcost.length ? 'A base usa acostamento nas linhas ' + comAcost.map(L => L.item).join(', ') + '.' : 'Base de cálculo restrita à faixa de pista nas ' + pav.length + ' linhas de reparo, tapa-buraco e remendo.', comAcost.map(L => L.id));

    // R08 mão de obra / equipamento como item
    const insumo = linhas.filter(L => /^[PE]\d{4}$/.test(L.codigo));
    add('R08', 'Art. 21', 'Sem mão de obra ou equipamento como item da planilha', insumo.length ? 'erro' : 'ok', insumo.length ? 'Itens de insumo direto: ' + insumo.map(L => L.codigo).join(', ') : 'Nenhum insumo de mão de obra ou equipamento lançado como item.', insumo.map(L => L.id));

    // R09 insumos asfálticos separados
    const am = linhas.filter(L => ASFALTO.test(L.codigo));
    const semTM = am.filter(L => !linhas.some(T => T.codigo === 'TM' + L.codigo.slice(2) && Math.abs(T.linha - L.linha) <= 2));
    add('R09', 'Art. 48, parágrafo único', 'Aquisição e transporte de betuminosos em itens próprios', semTM.length ? 'alerta' : 'ok', am.length + ' itens de aquisição de material betuminoso' + (semTM.length ? '; sem transporte ao lado: ' + semTM.map(L => L.item).join(', ') : ', todos com o transporte correspondente.'), semTM.map(L => L.id));

    // R10 binômio
    const bin = st.binomio || [];
    const poucos = bin.filter(b => (b.origens || []).length < 3);
    add('R10', 'Art. 46', 'Binômio com ao menos 3 origens por material betuminoso', !bin.length ? 'alerta' : poucos.length ? 'erro' : 'ok', !bin.length ? 'Nenhum binômio cadastrado.' : poucos.length ? 'Menos de 3 origens: ' + poucos.map(b => b.material).join('; ') : bin.length + ' materiais, todos com 3 ou mais origens.');

    // R11 engenheiro
    const eng = Number((st.adm || {}).engenheiroCoef);
    add('R11', 'Art. 25', 'Engenheiro supervisor entre 0,25 e 1,00', eng >= 0.25 && eng <= 1 ? 'ok' : 'erro', 'Coeficiente adotado: ' + (isNaN(eng) ? '—' : eng.toString().replace('.', ',')) + '.');

    // R12 fora do SICRO
    const fora = linhas.filter(L => !/^(\d{6,7}|AM\d+|TM\d+|GD|ADM|CAN|INSIND|MOB|DESMOB)$/.test(L.codigo));
    const codFora = [...new Set(fora.map(L => L.codigo))];
    add('R12', 'Art. 22 e art. 99', 'Composições fora do SICRO justificadas', codFora.length ? 'alerta' : 'ok', codFora.length ? 'Códigos próprios: ' + codFora.join(', ') + '. Precisam de composição e justificativa no processo.' : 'Todos os serviços usam código do SICRO.', fora.map(L => L.id));

    // R13 SNV
    const seg = (P.segmentos || []).slice().sort((a, b) => a.kmIni - b.kmIni);
    let gap = []; let cur = Number(P.kmIni);
    seg.forEach(s => { if (Math.abs(s.kmIni - cur) > 0.001) gap.push(cur.toFixed(1) + '–' + Number(s.kmIni).toFixed(1)); cur = Math.max(cur, s.kmFim); });
    if (seg.length && Math.abs(cur - Number(P.kmFim)) > 0.001) gap.push(cur.toFixed(1) + '–' + Number(P.kmFim).toFixed(1));
    add('R13', 'Art. 20, § 3º, e art. 33, I, a', 'SNV informado com versão e segmentos cobrindo o trecho', !P.snvVersao || !seg.length ? 'erro' : gap.length ? 'alerta' : 'ok', !seg.length ? 'Nenhum segmento SNV cadastrado.' : gap.length ? 'Lacunas entre segmentos: ' + gap.join(', ') : seg.length + ' segmentos na versão ' + P.snvVersao + ', cobrindo do km ' + P.kmIni + ' ao km ' + P.kmFim + '.');

    // R14 numeração
    const vistos = {}; const dup = []; linhas.forEach(L => { if (vistos[L.item]) dup.push(L.item); vistos[L.item] = 1; });
    const fora2 = []; R.ordem.forEach(o => { if (o.tipo !== 'l') return; const r = R.linhas[o.id]; const L = linhas.find(x => x.id === o.id); if (r.grupo && !L.item.startsWith(r.grupo + '.')) fora2.push(L.item + ' (dentro de ' + r.grupo + ')'); });
    add('R14', 'Organização da planilha', 'Numeração de itens única e coerente com o grupo', dup.length || fora2.length ? 'alerta' : 'ok', (dup.length ? 'Itens repetidos: ' + [...new Set(dup)].join(', ') + '. ' : '') + (fora2.length ? 'Itens numerados fora do grupo: ' + fora2.slice(0, 6).join('; ') + (fora2.length > 6 ? '…' : '') + '.' : '') || 'Numeração consistente.');

    // R15 histórico rastreável
    const h = (st.icp && st.icp.historico) || {}; const semFonte = Object.keys(h).filter(k => Number(h[k].valor) > 0 && !(h[k].contrato || h[k].medicao));
    add('R15', 'Art. 24, § 1º, e art. 84', 'Histórico executado com fonte rastreável', semFonte.length ? 'alerta' : 'ok', semFonte.length ? 'Histórico sem contrato ou medição de origem em: ' + semFonte.map(k => R.icp.regras[k] ? R.icp.regras[k].servico : k).join(', ') + '.' : 'Histórico vinculado a contrato e medição.');

    // R16 método ICP
    if (st.icp && st.icp.levantamento && st.icp.levantamento.some(r => r.sentido === 'D')) {
      const alt = calcICP(Object.assign({}, st, { icp: Object.assign({}, st.icp, { parametros: Object.assign({}, st.icp.parametros, { metodo: R.icp.metodo === 'planilha' ? 'faixas' : 'planilha' }) }) }));
      const diffs = Object.keys(R.icp.regras).filter(k => Math.abs(alt.regras[k].adotado - R.icp.regras[k].adotado) > 0.01).map(k => R.icp.regras[k].servico + ' ' + fmt(R.icp.regras[k].adotado) + ' → ' + fmt(alt.regras[k].adotado) + ' ' + R.icp.regras[k].unidade);
      add('R16', 'Art. 19, II e III, e Anexo XXVII', 'Quantidades do ICP refletem as duas faixas levantadas', R.icp.metodo === 'planilha' && diffs.length ? 'alerta' : 'ok',
        R.icp.metodo === 'planilha' ? 'O cálculo usa só a faixa crescente multiplicada por ' + R.icp.mult + ', mas o levantamento traz as duas faixas. Usando as duas: ' + (diffs.join('; ') || 'sem diferença') + '.' : 'Cálculo pelas duas faixas levantadas. Pelo método da planilha original seria: ' + (diffs.join('; ') || 'igual') + '.');
    }

    // R17 roçada mecanizada
    const inv = st.inventario || {}; const costal = Number((inv.rocadaCostal || {}).valor) || 0, mec = Number((inv.rocadaMec || {}).valor) || 0;
    add('R17', 'Art. 27', 'Roçada mecanizada preferencial; manual só com justificativa', costal > 0 && !(st.justificativas && st.justificativas.rocadaCostal) ? 'alerta' : 'ok', 'Inventário com ' + fmt(mec) + ' ha mecanizada e ' + fmt(costal) + ' ha costal.' + (costal > 0 ? ' A parcela costal precisa de justificativa registrada.' : ''));

    // R18 roçada DNIT 182
    add('R18', 'Art. 24, § 4º', 'Frequência de roçada pela DNIT 182/2018-PRO', R.rocada.adotado === R.rocada.sugerido ? 'ok' : 'alerta', 'Média ponderada das estações: ' + R.rocada.nerp.toFixed(2).replace('.', ',') + ' → sugerido ' + R.rocada.sugerido + ' roçadas/ano; adotado ' + R.rocada.adotado + '.');

    // R19 preços SD e CD
    const semP = Object.keys(R.linhas).filter(id => R.linhas[id].semPreco);
    add('R19', 'Art. 33, r e s', 'Preço com e sem desoneração em todas as linhas', semP.length ? 'erro' : 'ok', semP.length ? semP.length + ' linha(s) sem preço no banco: ' + semP.slice(0, 8).map(id => (linhas.find(L => L.id === id) || {}).codigo).join(', ') : 'Todas as linhas têm preço nas duas condições. Condição mais vantajosa: ' + (R.totais.condicao === 'sd' ? 'sem desoneração' : 'com desoneração') + '.', semP);

    // R20 sinalização de obras
    const sinal = linhas.some(L => /^521|^5213/.test(L.codigo));
    add('R20', 'Art. 44 e Anexo XIII', 'Sinalização de obras prevista para serviços na pista', sinal ? 'ok' : 'erro', sinal ? 'Dispositivos de sinalização de obras orçados.' : 'Nenhum dispositivo de sinalização de obras encontrado.');

    // R21 croqui x transportes
    const semC = []; Object.values(R.transportes).forEach(t => t.linhas.forEach(l => { if (l.semCroqui) semC.push(l.material + ' ' + l.origem + '→' + l.destino); }));
    add('R21', 'Art. 45 e Anexo IX', 'Toda DMT de transporte vem do croqui de ocorrências', semC.length ? 'erro' : 'ok', semC.length ? 'Sem DMT no croqui: ' + [...new Set(semC)].join('; ') : 'Todas as DMTs encontradas no croqui.');

    // R22 estimativas
    const est = linhas.filter(L => /ESTIMATIVA/i.test(L.origem));
    add('R22', 'Art. 18 e art. 24, § 1º', 'Estimativas apoiadas em justificativa técnica', est.length ? 'alerta' : 'ok', est.length ? est.length + ' linha(s) com origem "estimativa": ' + est.slice(0, 8).map(L => L.item).join(', ') + '. Precisam de nota técnica.' : 'Nenhuma quantidade por estimativa.', est.map(L => L.id));

  async function salvar() {
    if (!S || !dirty.size) return;
    if (!db || !canWrite) { setSave(db ? 'Somente leitura: alterações ficam nesta tela' : 'Sem base conectada: alterações ficam nesta tela'); return; }
    if (saving) { clearTimeout(saveTimer); saveTimer = setTimeout(salvar, 800); return; }
    saving = true; setSave('Salvando…');
    const pend = [...dirty]; dirty.clear();
    try {
      let meta = projetos.find(p => p.id === PID) || {};
      for (const part of pend) {
        if (part === 'precos') {
          const codes = Object.keys(S.precos || {}); const n = Math.max(1, Math.ceil(codes.length / CHUNK));
          for (let i = 0; i < n; i++) { const o = {}; codes.slice(i * CHUNK, (i + 1) * CHUNK).forEach(c => o[c] = S.precos[c]); await db.doc('projetos/' + PID + '/partes/precos_' + i).set({ precos: o }); }
          for (let i = n; i < (meta.precosChunks || 0); i++) await db.doc('projetos/' + PID + '/partes/precos_' + i).delete();
          meta.precosChunks = n;
        } else {
          const o = {}; PARTS[part].forEach(k => { if (S[k] !== undefined) o[k] = S[k]; });
          await db.doc('projetos/' + PID + '/partes/' + part).set(JSON.parse(JSON.stringify(o)));
        }
      }
      const partes = [...new Set([...(meta.partes || []), ...Object.keys(PARTS).filter(p => PARTS[p].some(k => S[k] !== undefined))])];
      meta = { nome: S.projeto.nome || PID, rodovia: S.projeto.rodovia || '', segmento: S.projeto.segmento || '', partes, precosChunks: meta.precosChunks || 1, atualizadoEm: new Date().toISOString(), origem: meta.origem || '' };
      await db.doc('projetos/' + PID).set(meta);
      const i = projetos.findIndex(p => p.id === PID); if (i >= 0) projetos[i] = Object.assign({ id: PID }, meta); else projetos.push(Object.assign({ id: PID }, meta));
      setSave('Salvo às ' + new Date().toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' }));
    } catch (e) {
      pend.forEach(p => dirty.add(p));
      if (e && e.code === 'invalid_argument') { canWrite = false; setSave('Sem permissão para salvar: alterações ficam nesta tela'); }
      else if (e && e.code === 'quota_exceeded') setSave('Base cheia: apague projetos antigos para salvar');
      else setSave('Não foi possível salvar agora. Nova tentativa em instantes.');

      ['Transportes (Anexo VIII)', 'Calculado', 'Momento = quantidade × consumo × DMT × FIT, por caminhão e tipo de via.'],
      ['Linhas do PATO', 'Calculado', 'Base × fator com truncamento ou arredondamento; insumos derivados por taxa; preço pelo código.'],
      ['Totais, resumo, curva ABC e contrato', 'Calculado', 'Resumo por família, condição mais vantajosa, faixas A/B/C, contrato pelo prazo.'],
      ['Sinalização de obras (Anexo XIII)', 'Entrada importada', 'un.dia por dispositivo lido da planilha. Cálculo pela duração dos serviços: próxima etapa.'],
      ['Preços SICRO e binômio', 'Entrada importada', 'Banco de preços por código. Binômio com escolha do menor custo. Composições próprias: próxima etapa.'],
      ['Administração local, canteiro, usina e mobilização', 'Entrada importada', 'Preço lido da planilha auxiliar. Composição detalhada: próxima etapa.'],
      ['Prorrogação (Anexo XXIV) e adequação (Anexo XXV)', 'Planejado', 'Vantajosidade, desconto adicional e deflator do art. 96.'],
    ];
    const ent = [
      ['Projeto', 'nome, rodovia, trecho, subtrecho, segmento, kmIni, kmFim, extensao, snv, snvVersao, unidadeLocal, tipo, dataBase, aberturaLicitacao, prazoAnos, dataInventario'],
      ['Segmento SNV', 'snv, tipoPista, kmIni, kmFim, latIni, lonIni, latFim, lonFim, revestimento, faixas, largura'],
      ['Elemento de inventário', 'chave, rotulo, valor, unidade, grupo, fonte'],
      ['Levantamento ICP (por km)', 'sentido (C/D), kmIni, kmFim, panela, remendo, trinca (Alta, Média, Baixa, SR), intervPrim, intervSec'],
      ['Regra ICP', 'id, servico, classes [coluna, intervenção], neExpr, unidade, neFonte, somaRegras'],
      ['Histórico executado', 'regra, valor, contrato, medicao, memoria'],
      ['Linha do PATO', 'id, item, origem, codigo, descricao, baseExpr, unidadeBase, fatorExpr, unidade, modo (trunc, round, icp), casas, icpRegra, justificativa'],
      ['Grupo', 'item, titulo, linha'],
      ['Preço', 'codigo, descricao, unidade, sd, cd, fonte'],
      ['Croqui', 'chave (material+origem+destino), material, origem, destino, LN, RP, P, Pu'],
      ['FIT', 'frente, codigo, chave, vmdf'],
      ['Bloco de transporte', 'id, frente, codigo, descricao, linhas [servico, material, origem, destino, consumoExpr, faixaPATO, colunaDMT, usaFIT, fitFrente]'],
      ['Desempenho', 'codigo, grupo, qtdTotalExpr, ne, freqExpr, qtdPorKmExpr, unidade'],
      ['Binômio', 'material, origens [origem, uf, local, aquisicao, transporte]'],
      ['Cotação', 'material, codigoSicro, fornecedor, preco, unidade, densidade, data, dmtPav, dmtNaoPav, fonte'],
      ['Gabarito', 'linhas {id: base, fator, qtd, puSD, sd, puCD, cd}, totais, resumo, icp, transportes'],
      ['Documento da biblioteca', 'titulo, categoria, assetId ou link, nome, tamanho, enviadoEm'],
    ];
    const imp = [
      ['Planilha PATO completa', 'Abas CAPA, PATO, BD, RESUMO_INVENT, ICP, CALCULO_ICP e, se houver, CAD_SEG, CAD_PISTA, CROQUI, FIT, TRANSPORTES_CONSERVA, TRANSPORTES_DSM, DESEMPENHO, NE_ROCADA, UN_DIA, BINOMIO_ANP, RESUMO_PATO, QUANTIDADES'],
      ['Inventário', 'Aba RESUMO_INVENT do modelo, ou colunas chave, valor, unidade'],
      ['Levantamento ICP', 'Aba ICP do modelo, ou colunas km inicial, km final, sentido, panela, remendo, trinca, intervenção primária, intervenção secundária'],
      ['Histórico', 'Colunas serviço (RL, TP, RP, COR, FSD, FSC, MICRO), quantidade, contrato, medição'],
      ['SNV', 'Planilha oficial do SNV: código, km inicial, km final, extensão, superfície'],
      ['Preços', 'Aba BD do modelo, ou colunas código, descrição, unidade, preço sem desoneração, preço com desoneração'],
      ['Cotações', 'Colunas material, fornecedor, preço, unidade, data, município, DMT'],
    ];
    return topo('Requisitos e modelo de dados', 'Especificação viva do sistema: módulos, entidades, formatos de importação e regras. As regras abaixo são as mesmas que rodam na tela de validações.') +
      '<div class="card doc"><h2>Objetivo e critério de aceite</h2><p>Gerar o plano anual de trabalho e orçamento de contratos de conservação rodoviária conforme a Res. DNIT nº 8/2023, com cada quantidade rastreável até a sua origem. O sistema é aceito quando reproduz, linha a linha, uma planilha PATO aprovada usando apenas os dados de entrada dela. Na BR-158/MT (km 326,00 ao km 416,80) o motor confere ' + (CMP ? CMP.linhasOk + ' de ' + CMP.linhasTotal : '—') + ' linhas e o total sem desoneração.</p>' +
      '<h2>Fluxo (art. 19)</h2><ul><li>Inventário dos elementos geradores de conservação</li><li>Condição e intensidade dos serviços (ICP, roçada, desempenho)</li><li>Quantidades pelos níveis de esforço e pelo histórico</li><li>Quantificação dos DSM com memória direta</li><li>Preços, transportes, consolidação, validação e saídas</li></ul></div>' +
      '<div class="card flat"><div style="padding:14px 16px 0"><h2>Módulos</h2></div><div class="tbl short"><table><thead><tr><th>Módulo</th><th>Situação</th><th>Regra</th></tr></thead><tbody>' + mods.map(m => '<tr><td><b>' + esc(m[0]) + '</b></td><td>' + pill(m[1] === 'Calculado' || m[1] === 'Calculado e conferido' ? 'ok' : m[1] === 'Planejado' ? 'info' : 'alerta').replace(/>[^<]+<\/span>$/, '>' + esc(m[1]) + '</span>') + '</td><td>' + esc(m[2]) + '</td></tr>').join('') + '</tbody></table></div></div>' +
      '<div class="card flat"><div style="padding:14px 16px 0"><h2>Modelo de dados</h2><p class="muted">Cada projeto é guardado em partes: projeto, inventário, ICP, linhas, transportes, apoio, preços (em blocos de ' + CHUNK + ' códigos), SNV e gabarito.</p></div><div class="tbl short"><table><thead><tr><th>Entidade</th><th>Campos</th></tr></thead><tbody>' + ent.map(e => '<tr><td><b>' + esc(e[0]) + '</b></td><td class="mono" style="font-size:.76rem">' + esc(e[1]) + '</td></tr>').join('') + '</tbody></table></div></div>' +
      '<div class="card flat"><div style="padding:14px 16px 0"><h2>Regras de validação</h2></div>' + VAL.map(v => '<div class="rule"><span class="chip">' + esc(v.id) + '</span><div class="art">' + esc(v.art) + '</div><h3>' + esc(v.titulo) + '</h3></div>').join('') + '</div>' +
      '<div class="card flat"><div style="padding:14px 16px 0"><h2>Formatos de importação</h2></div><div class="tbl short"><table><thead><tr><th>Arquivo</th><th>Estrutura esperada</th></tr></thead><tbody>' + imp.map(e => '<tr><td><b>' + esc(e[0]) + '</b></td><td>' + esc(e[1]) + '</td></tr>').join('') + '</tbody></table></div></div>';
  };

  // ---------------- render ----------------
  function render() {
    navHTML();
    const v = view(); const el = $('#view'); const y = window.scrollY;
    if (!S) { el.innerHTML = semProjeto(); return; }
    if (!R) recompute();
    try { el.innerHTML = (T[v] || T.painel)(); } catch (e) { console.error(e); el.innerHTML = '<div class="empty"><h2>Não foi possível montar esta tela</h2><p class="muted">' + esc(e.message) + '</p></div>'; }
    window.scrollTo(0, y);
  }

  // ---------------- eventos ----------------
  document.addEventListener('change', e => {
    const t = e.target;
    if (t.id === 'mobnav') { location.hash = t.value; return; }
    if (t.dataset.act === 'trocar') { (async () => { await salvar(); await abrirProjeto(t.value); render(); })(); return; }
    if (t.dataset.ui) { ui[t.dataset.ui] = t.type === 'checkbox' ? t.checked : t.value; render(); return; }
    if (t.dataset.edit) {
      const ty = t.dataset.type || 'text'; let v = ty === 'bool' ? t.checked : t.value;
      if (ty === 'num') { v = parseNum(t.value); if (v == null) { toast('Valor numérico inválido: ' + t.value); render(); return; } }
      setPath(t.dataset.edit, v); recompute(); render();
    }
  });
  document.addEventListener('input', e => { const t = e.target; if (t.dataset.ui === 'filtro' || t.dataset.ui === 'precoBusca') { ui[t.dataset.ui] = t.value; clearTimeout(render._t); render._t = setTimeout(() => { const pos = t.selectionStart; render(); const n = document.querySelector('[data-ui="' + t.dataset.ui + '"]'); if (n) { n.focus(); try { n.setSelectionRange(pos, pos); } catch (x) { } } }, 250); } });
  document.addEventListener('click', async e => {
    const imp = e.target.closest('[data-imp]');
    if (imp) { try { await ACOES_IMPORT[imp.dataset.imp](); } catch (err) { console.error(err); toast(err.message || String(err), 7000); } return; }
    const a = e.target.closest('[data-act]'); if (!a) return;
    if (a.dataset.act === 'fechar') { if (e.target.closest('[data-stop]') && !e.target.closest('button[data-act="fechar"]')) return; $('#drawer').innerHTML = ''; return; }
    const act = a.dataset.act;
    if (act === 'linha') return abrirLinha(a.dataset.id);
    if (act === 'salvarLinha') {
      const L = S.linhas.find(x => x.id === a.dataset.id); const d = $('#drawer'); const backup = JSON.stringify(L);
      d.querySelectorAll('[data-l]').forEach(i => L[i.dataset.l] = i.value.trim());
      recompute();
      if (R && R.linhas[L.id] && R.linhas[L.id].erro) { Object.assign(L, JSON.parse(backup)); recompute(); $('#lerr').textContent = 'Não aplicado: ' + R.erros.slice(-1)[0]; return; }
      markDirty('linhas'); d.innerHTML = ''; render(); toast('Linha ' + L.item + ' atualizada.'); return;
    }
    if (act === 'sentido') { ui.sentido = a.dataset.v; return render(); }
    if (act === 'valStatus') { ui.valStatus = a.dataset.v; return render(); }
    if (act === 'abc') { ui.abc = a.dataset.v; return render(); }
    if (act === 'verLinhas') { ui.linhasDestaque = a.dataset.ids.split(','); ui.filtro = ''; ui.origem = ''; ui.soComProblema = false; ui.derivados = true; location.hash = 'planilha'; return render(); }
    if (act === 'limparDestaque') { ui.linhasDestaque = null; return render(); }
    if (act === 'addSeg') { S.projeto.segmentos = S.projeto.segmentos || []; S.projeto.segmentos.push({ snv: '', tipoPista: 'PISTA SIMPLES', kmIni: S.projeto.kmIni, kmFim: S.projeto.kmFim }); markDirty('projeto'); recompute(); return render(); }
    if (act === 'delSeg') { S.projeto.segmentos.splice(Number(a.dataset.i), 1); markDirty('projeto'); recompute(); return render(); }
    if (act === 'xlsx') return exportarXLSX();
    if (act === 'json') return exportarJSON();
    if (act === 'bibUp') {
      const tit = $('#bibTit').value.trim(), cat = $('#bibCat').value, link = $('#bibLink').value.trim();
      const f = await escolherArquivo('.pdf,image/*'); if (!f) return;
      try { toast('Enviando ' + f.name + '…', 10000); const up = await assets.upload(f); await db.collection('biblioteca').add({ titulo: tit || f.name.replace(/\.[^.]+$/, ''), categoria: cat, assetId: up.id, url: up.url, nome: f.name, tamanho: up.sizeBytes, tipo: up.contentType, link: link || '', enviadoEm: new Date().toISOString() }); toast('Documento acrescentado.'); }
      catch (err) { toast('Não foi possível enviar: ' + (err.message || err.code), 7000); }
      return;
    }
    if (act === 'bibLink') {
      const tit = $('#bibTit').value.trim(), cat = $('#bibCat').value, link = $('#bibLink').value.trim();
      if (!/^https?:\/\//.test(link)) { toast('Informe um link começando com https://'); return; }
      try { await db.collection('biblioteca').add({ titulo: tit || link, categoria: cat, link, enviadoEm: new Date().toISOString() }); toast('Link salvo.'); } catch (err) { toast('Não foi possível salvar: ' + (err.message || err.code)); }
      return;
    }
    if (act === 'bibDel') {
      const b = biblioteca.find(x => x.id === a.dataset.id); if (!b) return;
      if (a.dataset.confirm !== '1') { a.dataset.confirm = '1'; a.textContent = 'Confirmar remoção'; setTimeout(() => { if (a.isConnected) { a.dataset.confirm = ''; a.textContent = 'Remover'; } }, 4000); return; }
      try { if (b.assetId && assets) { try { await assets.delete(b.assetId); } catch (x) { } } await db.doc('biblioteca/' + b.id).delete(); toast('Documento removido.'); } catch (err) { toast('Não foi possível remover: ' + (err.message || err.code)); }
    }
  });
  document.addEventListener('keydown', e => { if (e.key === 'Escape' && $('#drawer').innerHTML) $('#drawer').innerHTML = ''; });
  window.addEventListener('hashchange', () => { $('#drawer').innerHTML = ''; if (view() !== 'planilha') ui.linhasDestaque = null; render(); window.scrollTo(0, 0); });
  window.addEventListener('beforeunload', () => { if (dirty.size) salvar(); });

  // ---------------- início ----------------
  (async function init() {
    render();
    const c = window.claude;
    if (c && c.use) {
      const [d, u, a, dl] = await Promise.all(['db', 'user', 'assets', 'downloads'].map(n => c.use(n).catch(() => null)));
      db = d; user = u; assets = a; downloads = dl;
      if (user && user.can) { try { const w = await user.can('data.write'); if (w === false) canWrite = false; } catch (e) { } }
    }
    if (db) {
      try {
        await carregarLista();
        const pref = sget('pato.pid'); const pid = projetos.find(p => p.id === pref) ? pref : (projetos[0] && projetos[0].id);
        if (pid) await abrirProjeto(pid); else setSave(canWrite ? 'Nenhum projeto salvo' : 'Somente leitura');
        unsubBib = db.collection('biblioteca').onSnapshot(s => { biblioteca = s.docs.map(x => Object.assign({ id: x.id }, x.data())); if (view() === 'biblioteca') render(); }, () => { });
      } catch (e) { console.error(e); setSave('Base de projetos indisponível agora'); }
    } else setSave('Base de projetos indisponível nesta visualização');
    render();
  })();
})();

</script>
